name: House floor — weekly

on:
  schedule:
    - cron: "0 13 * * 6"   # Saturday 13:00 UTC (08:00 EST / 09:00 EDT)
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "How many days back to scan"
        default: "14"
      max_sessions:
        description: "Max sessions to process this run"
        default: "12"
      max_runtime_minutes:
        description: "Stop starting new sessions past this many minutes"
        default: "240"

concurrency:
  group: house-floor-weekly
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    # 2026-09-19 real run: a single 13h day alone took ~4h (240min) to process,
    # and the job hit this timeout mid-way through the NEXT session and was
    # cancelled. --max-runtime-minutes (below) stops new sessions from
    # STARTING once the budget is spent, so a normal run now exits cleanly
    # instead of being killed; 350 (vs the 360 hosted-runner hard cap) is
    # margin for one long session already in flight when the budget check
    # fires, plus the always-run artifact-staging/upload steps after it.
    timeout-minutes: 350
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOVINFO_API_KEY: ${{ secrets.GOVINFO_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PYANNOTE_AI_KEY: ${{ secrets.PYANNOTE_AI_KEY }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # `modal` is not in requirements.txt (installed separately per
          # bench/README); the --compute modal path needs the client.
          pip install 'modal==1.5.0' pyyaml

      - name: Discover + dispatch House-floor sessions
        # Defaults sized so the weekly Saturday run captures the WHOLE week plus a
        # full week of backlog: a 14-day window (double the cadence, so a missed or
        # failed run — or a session whose CREC lagged past Saturday — is still
        # caught the next week) and a 12-session cap (well above a normal week's
        # legislative days). Dedup against the DB means nothing is processed twice.
        env:
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '14' }}
          MAX_SESSIONS: ${{ github.event.inputs.max_sessions || '12' }}
          MAX_RUNTIME_MINUTES: ${{ github.event.inputs.max_runtime_minutes || '240' }}
        run: |
          python -m src.floor_dispatch \
            --lookback-days "$LOOKBACK_DAYS" \
            --max-sessions "$MAX_SESSIONS" \
            --max-runtime-minutes "$MAX_RUNTIME_MINUTES"

      - name: Stage floor session artifacts (JSON only)
        if: always()
        run: python bench/stage_floor_artifacts.py

      - name: Upload floor sessions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: house-floor-sessions
          path: artifact_staging
          retention-days: 30
          if-no-files-found: warn
