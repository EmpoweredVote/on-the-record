version: 2

# Grouped updates.
# Rationale: the ungrouped default produced 312 open alerts and 37
# competing PRs across 8 repos in a single day (2026-08-26). Grouping
# collapses a sweep into one PR per manifest, and the open-PR cap then
# applies to groups rather than to individual packages.
#
# Merge guidance: security and patch are safe on green CI. minor and
# majors are decisions - read them.
updates:
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "America/Indiana/Indianapolis"
    open-pull-requests-limit: 5
    groups:
      # Security fixes travel together: one PR per manifest, one review.
      security:
        applies-to: security-updates
        patterns: ["*"]
      # Patch only. 1.2.3 -> 1.2.4 does not change API under any
      # convention, including pre-1.0. Safe to merge on green CI.
      patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["patch"]
      # Minor gets its own group and a real review. npm reads 0.5 -> 0.12
      # as "minor" because the major digit stays 0, but for a 0.x package
      # that IS a breaking change by convention. On 2026-08-27 exactly
      # that shipped @supabase/ssr 0.5 -> 0.12 inside a combined
      # minor+patch group and broke the ev-accounts backend typecheck
      # (postgrest-js tightened RejectExcessProperties). Splitting minor
      # out keeps patches mergeable without dragging 0.x jumps along.
      minor:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor"]
      # Majors are grouped, NOT ignored. Ignoring semver-major risks
      # suppressing a security fix that needs one - the vitest 2 -> 3
      # bump on 2026-08-26 closed two critical alerts and was a major.
      majors:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]
    # TEMPORARY, added 2026-08-27. TypeScript 7.0.2 shipped 2026-08-26
    # and typescript-eslint does not support it: 8.68.0, the newest
    # release, peers `typescript: ">=4.8.4 <6.1.0"`. Every repo that
    # lints with typescript-eslint fails `npm install` on ERESOLVE, and
    # the rest only pass because that check is absent. Dependabot put
    # TS 7 in 12 of 17 open major PRs, blocking all of them.
    #
    # REMOVE THIS when typescript-eslint peers TypeScript 7. Check with:
    #   npm view typescript-eslint@latest peerDependencies.typescript
    # Scoped to typescript alone, deliberately — not a blanket major
    # ignore, which would risk suppressing a security fix.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # TEMPORARY, added 2026-08-28. ESLint 10 cannot run in this repo.
      # eslint-config-next vendors eslint-plugin-react, which still calls
      # context.getFilename() - removed in ESLint 10. The result is not a
      # lint failure but a hard crash on the first React file:
      #   TypeError: Error while loading rule 'react/display-name':
      #   contextOrFilename.getFilename is not a function
      # so NOTHING gets linted, which is worse than a red check.
      #
      # There is no fix to wait for yet: eslint-plugin-react 7.37.5 is the
      # newest release and peers eslint up to ^9.7 only; eslint-config-next
      # 16.3.3, also newest, still depends on ^7.37.0.
      #
      # REMOVE THIS when eslint-plugin-react ships eslint 10 support:
      #   npm view eslint-plugin-react@latest peerDependencies.eslint
      # Every other EV repo took ESLint 10 on 2026-08-28; this is the sole
      # holdout, and only because of the Next lint preset.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
