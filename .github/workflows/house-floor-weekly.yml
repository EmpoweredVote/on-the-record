name: House floor — weekly

on:
  schedule:
    - cron: "0 13 * * 6"   # Saturday 13:00 UTC (08:00 EST / 09:00 EDT)
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "How many days back to scan"
        default: "14"
      max_sessions:
        description: "Max sessions to process this run"
        default: "12"

concurrency:
  group: house-floor-weekly
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOVINFO_API_KEY: ${{ secrets.GOVINFO_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PYANNOTE_AI_KEY: ${{ secrets.PYANNOTE_AI_KEY }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # `modal` is not in requirements.txt (installed separately per
          # bench/README); the --compute modal path needs the client.
          pip install 'modal==1.5.0' pyyaml

      - name: Discover + dispatch House-floor sessions
        # Defaults sized so the weekly Saturday run captures the WHOLE week plus a
        # full week of backlog: a 14-day window (double the cadence, so a missed or
        # failed run — or a session whose CREC lagged past Saturday — is still
        # caught the next week) and a 12-session cap (well above a normal week's
        # legislative days). Dedup against the DB means nothing is processed twice.
        env:
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '14' }}
          MAX_SESSIONS: ${{ github.event.inputs.max_sessions || '12' }}
        run: |
          python -m src.floor_dispatch \
            --lookback-days "$LOOKBACK_DAYS" \
            --max-sessions "$MAX_SESSIONS"
