name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  # Supersede stale runs on a PR branch, but let every push to main finish so
  # each merge gets its own verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Deliberately NO secrets / env. tests/conftest.py clears DATABASE_URL and
    # RENDER_DEPLOY_HOOK_URL for every test, and the `live_db` tests skip unless
    # DATABASE_URL was exported before pytest started — so here they skip. There
    # is no .env.local in CI for run_local.py's import-time loader to pick up.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install ffmpeg
        # test_cleanup / test_thumbnail exercise real ffmpeg and skip without it.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python deps
        id: deps
        run: |
          python -m pip install --upgrade pip
          # The suite needs torch (run_local.run_pipeline imports it) and
          # pyannote.metrics (DER tests), so the full requirements.txt stays. But
          # nothing here touches a GPU: install CPU-only torch/torchaudio FIRST so
          # requirements.txt sees them satisfied instead of pulling PyPI's
          # ~2.5 GB of CUDA wheels (which would also bloat the pip cache).
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          # Same pin as house-floor-weekly.yml; not in requirements.txt.
          # test_vibevoice_gpu_sweep importorskips it.
          pip install 'modal==1.5.0'

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider

      # pytest.ini's `testpaths = tests` never collects the skill suites, and
      # each needs its OWN pytest run: every one of these test dirs has an
      # __init__.py, so pytest names them all package `tests`, and the second
      # one loaded in a run fails to import. `!cancelled()` so a red step above
      # cannot hide a skill suite's own result. audit-quotes holds
      # test_fixture_parity.py, the on-the-record half of the shared
      # docs/quote-curation/fixtures parity pair (ev-accounts' research-stances
      # checker is the other half).
      - name: Run audit-quotes skill tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python -m pytest .claude/skills/audit-quotes/tests -q -p no:cacheprovider

      - name: Run _shared skill tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python -m pytest .claude/skills/_shared/tests -q -p no:cacheprovider

  web:
    # The Next.js site in web/ had no CI, so web dependency bumps were never built before
    # merge. Build it and run its unit tests. No secrets: the build needs none.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

  # Dependabot auto-merge. Runs only on Dependabot PRs, only after every job above passed
  # (or was skipped on purpose), and only for patch/minor updates. Majors stay open for a
  # person to read. A merge that fails (usually a lockfile conflict after a sibling PR
  # merged) is left alone: Dependabot rebases the PR, CI reruns, and this job tries again.
  # Merges made with GITHUB_TOKEN do not start push-triggered workflows; hosting deploys
  # (which listen to GitHub directly) still run.
  dependabot-automerge:
    name: dependabot auto-merge
    needs: [pytest, web]
    if: >-
      always()
      && github.event_name == 'pull_request'
      && github.event.pull_request.user.login == 'dependabot[bot]'
      && github.actor == 'dependabot[bot]'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3.1.0
      - name: Merge patch and minor updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh pr merge --squash "$PR_URL"; then
            echo "::warning::Merge did not go through (likely a conflict). Dependabot will rebase and this job will retry."
          fi
